<style>

}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#13302c;font-family:var(--font);color:var(--green);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums tabular-nums}

input,textarea{font-family:inherit}

/* ---------- scène 16:9 ---------- */
#viewport{position:fixed;inset:0 0 58px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:1600px;height:900px;position:relative;transform-origin:center center;flex:0 0 auto}
.slide{position:absolute;inset:0;width:1600px;height:900px;overflow:hidden;opacity:0;pointer-events:none;
  transition:opacity .45s ease, transform .45s cubic-bezier(.4,0,.2,1);transform:translateX(24px);box-shadow:0 40px 90px -30px rgba(0,0,0,.6)}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.prev{transform:translateX(-24px)}
.dark{background:var(--green);color:#fff}
.light{background:var(--cream);color:var(--green)}

/* entrées animées */
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.slide.on .anim>*{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.anim>*:nth-child(2){animation-delay:.07s!important}.anim>*:nth-child(3){animation-delay:.14s!important}
.anim>*:nth-child(4){animation-delay:.21s!important}.anim>*:nth-child(5){animation-delay:.28s!important}
.anim>*:nth-child(6){animation-delay:.35s!important}.anim>*:nth-child(7){animation-delay:.42s!important}
.anim>*:nth-child(8){animation-delay:.49s!important}.anim>*:nth-child(9){animation-delay:.56s!important}
.anim>*:nth-child(n+10){animation-delay:.6s!important}

/* éléments récurrents */

.title{font-size:54px;font-weight:700;margin:0;line-height:1.08;letter-spacing:-.3px}
.bar{width:240px;height:6px;border-radius:3px;background:var(--gold);margin:22px 0 0}
.kicker{font-size:17px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:700}
.foot{position:absolute;left:48px;bottom:22px;font-size:19px;font-style:italic;opacity:.85}
.dark .foot{color:#9fb7b2}
.quote{font-style:italic;font-size:22px;line-height:1.5}
.split{display:grid;height:100%}
.split>.l{background:var(--green);color:#fff;position:relative;padding:70px 48px}
.split>.r{position:relative;padding:70px 64px 40px 60px}
.ico{display:inline-flex}
.ico svg{width:100%;height:100%}

/* pilules */
.pill{display:flex;align-items:center;gap:18px;border-radius:999px;padding:0 36px;min-height:76px;font-size:26px;position:relative;transition:background .2s, transform .2s}
.pill .lab{flex:1;line-height:1.15}

.pill .val{font-weight:700;color:var(--gold);font-size:30px;white-space:nowrap;display:flex;align-items:baseline;gap:6px}
.pill.g1{background:var(--green3)} .pill.g2{background:var(--green2)}
.pill.gold{background:var(--gold);color:var(--green);font-weight:700}
.pill.gold .val{color:var(--green)}
.pill.b1{background:var(--beige);font-style:italic} .pill.b2{background:var(--beige2);font-style:italic}
.light .pill .val{color:var(--green)}
.pill.flash .val{animation:flash .6s ease}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}

/* champs intégrés */
input.v{border:0;background:transparent;color:inherit;font:inherit;font-weight:700;text-align:right;width:190px;padding:4px 2px;outline:none;
  border-bottom:2px dashed rgba(201,169,123,.55);transition:border-color .2s}
input.v:focus{border-bottom-color:var(--gold)}
input.v::placeholder{color:currentColor;opacity:.35}
.light input.v{border-bottom-color:rgba(35,77,71,.3)}
.light input.v:focus{border-bottom-color:var(--green)}
.unit{font-weight:700}
textarea.note{width:100%;border:0;border-radius:44px;background:var(--beige);color:var(--green);font-size:23px;font-style:italic;padding:30px 36px;resize:none;outline:none;line-height:1.45}
textarea.note::placeholder{color:var(--green);opacity:.75}

/* chips */
.chips{display:flex;gap:16px}
.chip{flex:1;border:0;border-radius:999px;background:var(--beige);color:var(--green);font-size:24px;min-height:84px;transition:all .25s;padding:0 10px}

.chip.on{background:var(--green);color:#fff;font-weight:700;transform:scale(1.04);box-shadow:0 14px 30px -14px rgba(35,77,71,.7)}

/* formulaire fiscalité */
.form{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:36px;padding:30px 32px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:22px}
.frow:last-child{border-bottom:0}
.frow label{color:#d8e4e1}
.frow .in{display:flex;align-items:baseline;gap:6px;color:var(--gold);font-size:24px}
.frow input.v{width:150px}
.seg{display:flex;background:rgba(0,0,0,.18);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;color:#d8e4e1;font-size:19px;padding:9px 18px;border-radius:999px;transition:.2s}
.seg button.on{background:var(--gold);color:var(--green);font-weight:700}
.step{display:flex;align-items:center;gap:12px}

/* statistiques gauches */
.big{font-size:190px;font-weight:700;color:var(--gold);line-height:1;text-align:center;letter-spacing:-4px}

/* conformité */
.doc{display:flex;align-items:center;gap:26px;border-radius:999px;padding:0 36px 0 20px;height:74px;font-size:26px;cursor:pointer;user-select:none;transition:background .2s}
.doc:nth-child(odd){background:var(--green3)} .doc:nth-child(even){background:var(--green2)}

.btn{border:0;border-radius:999px;background:var(--gold);color:var(--green);font-weight:700;font-size:22px;padding:14px 30px;transition:.2s;display:inline-flex;align-items:center;gap:10px}

/* synthèse */
.band{display:flex;align-items:center;gap:26px;background:var(--beige);border-radius:110px;padding:22px 34px 26px 30px;margin-bottom:26px}

/* ------------------------------------------------------------ OBJECTIFS (slides 11 et 17) */

  ['epargne', 'Fructifier mon épargne',       'Faire travailler l\'argent qui dort, sans perdre le sommeil',  'trend',  'Permanent'],

/* ------------------------------------------------------------ PROFIL INVESTISSEUR MIC */
const SECTIONS = {exp:"Expérience & connaissances", cap:"Situation & capacité", risk:"Tolérance au risque"};
const CARDS = [
  { id:'q1', sec:'exp', type:'single', s:'Ancienneté sur les marchés',

  { id:'q2', sec:'exp', type:'multi', s:'Placements déjà détenus',

    opts:[{l:"Livrets & épargne",d:"Livret A, LDDS, PEL…",pts:{know:1}},{l:"Assurance-vie",d:"ou capitalisation",pts:{know:2}},
          {l:"Comptes-titres / PEA",d:"Actions, ETF, OPC",pts:{know:3}},{l:"Épargne retraite",d:"PER, PERP, Madelin…",pts:{know:2}},
          {l:"SCPI / immobilier",d:"Pierre-papier",pts:{know:3}},{l:"Private equity",d:"FIP, FCPI, FCPR…",pts:{know:4}}]},
  { id:'q3', sec:'exp', type:'single', s:'Mode de gestion',

    opts:[{l:"Je ne gère pas encore",d:"Tout est à construire",pts:{know:0}},{l:"Gestion conseillée",d:"Accompagné par un conseiller",pts:{know:4}},
          {l:"Gestion directe",d:"Je décide moi-même",pts:{know:6}},{l:"Gestion sous mandat",d:"Déléguée à un gérant",pts:{know:5}}]},
  { id:'q4', sec:'exp', type:'multi', s:'Produits compris',

    opts:[{l:"Fonds en euros",d:"Capital garanti",pts:{know:1}},{l:"Obligations",d:"Sensibles aux taux",pts:{know:2}},
          {l:"Actions",d:"Long terme, volatiles",pts:{know:3}},{l:"SCPI",d:"Immobilier, peu liquide",pts:{know:2}},
          {l:"Produits structurés",d:"Protection conditionnelle",pts:{know:4}},{l:"Capital-investissement",d:"Non coté, 6-8 ans",pts:{know:4}}]},
  { id:'q5', sec:'exp', type:'single', s:'Forte baisse déjà vécue',
    q:"Avez-vous déjà traversé une forte baisse sur l'un de vos placements ?", help:"Et si oui, comment l'avez-vous gérée ?",
    opts:[{l:"Non, jamais",d:"Je n'y ai pas encore été confronté",pts:{tol:1,know:0}},{l:"Oui — j'ai tout vendu",d:"La baisse m'a fait sortir",pts:{tol:0,know:1}},
          {l:"Oui — j'ai patienté",d:"J'ai gardé le cap",pts:{tol:5,know:3}},{l:"Oui — j'ai renforcé",d:"J'en ai profité pour investir",pts:{tol:9,know:4}}]},
  { id:'q6', sec:'cap', type:'single', s:'Horizon de placement',
    q:"Dans quel délai pourriez-vous avoir besoin de cette épargne ?", help:"Votre horizon de placement le plus long pour ce projet.",
    opts:[{l:"Moins de 1 an",d:"Très court terme",pts:{cap:0}},{l:"1 à 3 ans",d:"Court terme",pts:{cap:3}},
          {l:"3 à 5 ans",d:"Moyen terme",pts:{cap:7}},{l:"Plus de 5 ans",d:"Long terme",pts:{cap:10}}]},
  { id:'q7', sec:'cap', type:'single', s:'Baisse supportable',
    q:"Quelle baisse temporaire pourriez-vous supporter sereinement ?", help:"Sans que cela ne menace vos projets ni votre tranquillité.",
    opts:[{l:"Aucune perte",d:"La sécurité d'abord",pts:{cap:0,tol:0}},{l:"Jusqu'à -10 %",d:"Des variations limitées",pts:{cap:4,tol:3}},
          {l:"Entre -10 % et -30 %",d:"Des creux passagers",pts:{cap:8,tol:7}},{l:"Plus de -30 %",d:"Je vise le long terme",pts:{cap:11,tol:10}}]},
  { id:'q8', sec:'cap', type:'single', s:'Part investissable',
    q:"Quelle part de votre patrimoine est éligible à de l'investissement ?", help:"La part que vous pourriez mobiliser sans toucher à votre épargne de sécurité.",
    opts:[{l:"Une petite part",d:"L'essentiel doit rester disponible",pts:{cap:0}},{l:"Une part modérée",d:"Une fraction confortable",pts:{cap:4}},
          {l:"Environ la moitié",d:"Un bon équilibre",pts:{cap:7}},{l:"Une part importante",d:"J'ai d'autres réserves solides",pts:{cap:10}}]},
  { id:'q9', sec:'risk', type:'single', s:'Rapport au risque',
    q:"Pour vos placements, quelle phrase vous ressemble le plus ?", help:"Il n'y a pas de bonne réponse — seulement la vôtre.",
    opts:[{l:"Ne jamais prendre de risque",d:"Tout en placements sûrs",pts:{tol:0}},{l:"Un peu de risque, prudemment",d:"Une petite part dynamique",pts:{tol:4}},
          {l:"Du risque si le gain en vaut la peine",d:"Une part importante exposée",pts:{tol:8}},{l:"Viser la performance maximale",d:"Quitte à beaucoup fluctuer",pts:{tol:12}}]},
  { id:'q10', sec:'risk', type:'scenario', s:'Placement choisi (8 ans)',
    q:"Trois placements, leurs fourchettes de rendement sur 8 ans. Lequel choisissez-vous ?", help:"De l'estimation la plus pessimiste à la plus optimiste, chaque année.",
    scen:[{name:"Sérénité",lo:-1,hi:4,pts:{tol:1}},{name:"Équilibre",lo:-7,hi:9,pts:{tol:6}},{name:"Ambition",lo:-18,hi:22,pts:{tol:12}}]},
  { id:'q11', sec:'risk', type:'single', s:'Réflexe à −15 %',
    q:"Votre portefeuille perd −15 % en un mois de turbulences. Votre réflexe ?", help:"Réaction à chaud face à une baisse marquée.",
    opts:[{l:"Je vends tout",d:"Stopper l'hémorragie",pts:{tol:0}},{l:"J'allège un peu",d:"Réduire la voilure",pts:{tol:3}},
          {l:"Je ne touche à rien",d:"Garder le cap",pts:{tol:8}},{l:"J'en profite pour renforcer",d:"Acheter à bon compte",pts:{tol:12}}]},
  { id:'q12', sec:'risk', type:'single', s:'Pari sur 20 000 €',
    q:"On vous propose d'échanger un revenu certain de 20 000 € contre…", help:"50 % de chances de doubler (40 000 €), 50 % de baisser d'un tiers (13 333 €).",
    opts:[{l:"Non merci, je garde le certain",d:"La sécurité prime",pts:{tol:0}},{l:"J'hésite mais je refuse",d:"Trop d'incertitude",pts:{tol:3}},
          {l:"Je tente, le potentiel m'attire",d:"Le gain en vaut le coup",pts:{tol:8}},{l:"Sans hésiter, je prends le pari",d:"J'aime le risque",pts:{tol:12}}]},
  { id:'q13', sec:'risk', type:'single', s:'Objectif prioritaire',
    q:"Enfin, quel est votre objectif prioritaire ?", help:"Ce qui compte le plus pour vous, aujourd'hui.",
    opts:[{l:"Préserver mon capital",d:"Éviter les pertes avant tout",pts:{tol:0,cap:2}},{l:"Générer des revenus",d:"Dividendes, coupons, loyers",pts:{tol:4}},
          {l:"Faire croître mon capital",d:"Accepter du risque pour grandir",pts:{tol:8}},{l:"Maximiser la performance",d:"Viser haut sur le long terme",pts:{tol:12}}]},
];
const PROFILES = [
  { key:'Prudent',   color:'#7fa9a1', eq:.15, exp:2.0, vol:3,
    tag:"Vous privilégiez la sécurité. Votre capital est protégé en priorité, avec une exposition mesurée pour ne pas subir l'inflation.",
    alloc:[["Fonds euros & monétaire",60],["Obligations",25],["Actions & diversifié",15]]},
  { key:'Équilibré', color:'#b8c79a', eq:.40, exp:4.0, vol:8,
    tag:"Vous recherchez un équilibre entre sécurité et performance. Des fluctuations modérées sont acceptées au service d'un rendement régulier.",
    alloc:[["Fonds euros & obligations",55],["Actions",35],["Immobilier & diversifié",10]]},
  { key:'Dynamique', color:'#c9a97b', eq:.70, exp:6.0, vol:14,
    tag:"Vous visez la croissance du capital sur le long terme et acceptez des baisses temporaires marquées en contrepartie d'un potentiel élevé.",
    alloc:[["Actions",65],["Obligations & diversifié",25],["Non coté & thématiques",10]]},
  { key:'Offensif',  color:'#c8735c', eq:.92, exp:7.5, vol:20,
    tag:"Vous recherchez la performance maximale sur un horizon long. Une forte volatilité fait partie du jeu et ne vous détourne pas de votre cap.",
    alloc:[["Actions",80],["Non coté & private equity",12],["Diversifié & opportuniste",8]]},
];
const MAXP = (()=>{ const m={tol:0,cap:0,know:0};
  CARDS.forEach(c=>{
    if(c.type==='multi'){ c.opts.forEach(o=>{for(const k in o.pts) m[k]+=o.pts[k];}); return; }
    const best={}; (c.opts||c.scen).forEach(o=>{for(const k in o.pts) best[k]=Math.max(best[k]||0,o.pts[k]);});
    for(const k in best) m[k]+=best[k];
  }); return m; })();

/* ------------------------------------------------------------ ÉTAT */
const DEFAULT = () => ({
  client:'', date:new Date().toISOString().slice(0,10),
  lifeGoals:'', prio:Object.fromEntries(OBJ.map(o=>[o[0],0])), prioWords:'',
  bes:Object.fromEntries(OBJ.map(o=>[o[0],{h:o[4],c:'',r:''}])),
  sit:'seul', enfants:0, isole:false,
  age:null, rev1:null, rev2:null, irAvis:null, retAge:CONFIG.retirementAge,
  patFin:null, patImmo:null,
  livrets:null, livretRate:CONFIG.livretRate, targetRate:CONFIG.targetRate, inflation:CONFIG.inflation, epNote:'',
  mensualites:null, immoNote:'',
  retWanted:null, retRate:CONFIG.replaceRates[0], retNote:'',
  answers:{}, qIdx:0, simAmt:50000, simShock:10, simProfile:null,
  know:null, risk:null, loss:null, esg:null,
  capMens:null, ov:{}, docs:[0,0,0,0,0,0,0,0], rdvDate:'', rdvTime:'',
});
const SKEY='mic-'+MODE;
let S;
try{ S = Object.assign(DEFAULT(), JSON.parse(sessionStorage.getItem(SKEY)||'{}')); }catch(e){ S = DEFAULT(); }
const save = () => { try{ sessionStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){} };
const getK = p => p.split('.').reduce((o,k)=>o==null?o:o[k], S);
const setK = (p,v) => { const ks=p.split('.'), last=ks.pop(); ks.reduce((o,k)=>o[k],S)[last]=v; };

/* ------------------------------------------------------------ CALCULS */
const n = v => (v==null || isNaN(v)) ? 0 : +v;
function bareme(q){ let t=0, prev=0; for(const [lim,rate] of CONFIG.bareme){ if(q>prev) t+=(Math.min(q,lim)-prev)*rate; prev=lim; } return t; }
function tmi(q){ for(const [lim,rate] of CONFIG.bareme){ if(q<=lim) return rate; } return .45; }
function abattement(sal){ if(sal<=0) return 0; const {taux,min,max}=CONFIG.abat; return Math.min(sal, Math.max(min, Math.min(max, sal*taux))); }
function nbParts(){
  const base = S.sit==='couple' ? 2 : 1, k = n(S.enfants);
  let p = base + Math.min(k,2)*.5 + Math.max(0,k-2);
  if(S.sit!=='couple' && S.isole && k>0) p += .5;
  return {base, parts:p};
}
function coutEmployeur(net){
  const T=CONFIG.urssaf; if(!net||net<=0) return 0;
  if(net<=T[0][0]) return net*T[0][1]/T[0][0];
  const L=T[T.length-1]; if(net>=L[0]) return net*L[1]/L[0];
  for(let i=1;i<T.length;i++) if(net<=T[i][0]){ const a=T[i-1],b=T[i],t=(net-a[0])/(b[0]-a[0]); return a[1]+t*(b[1]-a[1]); }
}
function pmt2capital(m, ratePct, years){ const r=ratePct/100/12, N=years*12; return m<=0?0:(r? m*(1-Math.pow(1+r,-N))/r : m*N); }

function calc(){
  const couple = S.sit==='couple';
  const r1=n(S.rev1), r2=couple?n(S.rev2):0, revFoyer=r1+r2, netM=revFoyer/12;
  const rni = Math.max(0, r1-abattement(r1) + r2-abattement(r2));
  const {base, parts} = nbParts();
  const brutParts = bareme(rni/parts)*parts, brutBase = bareme(rni/base)*base;
  let capAvantage = (parts-base)*2*CONFIG.qfCap;
  if(!couple && S.isole && n(S.enfants)>0) capAvantage += CONFIG.qfCapIsole - CONFIG.qfCap;
  let ir = Math.max(brutParts, brutBase - capAvantage);
  const d = couple ? CONFIG.decote.couple : CONFIG.decote.seul;
  ir = Math.max(0, ir - Math.max(0, Math.min(ir, d - CONFIG.decote.taux*ir)));
  if(ir < CONFIG.irMinRecouvrement) ir = 0;
  ir = Math.round(ir);
  const irUsed = S.irAvis!=null ? n(S.irAvis) : ir;
  const qfUsed = brutParts >= brutBase - capAvantage ? rni/parts : rni/base;
  const ps = (r1?coutEmployeur(r1)-r1:0) + (r2?coutEmployeur(r2)-r2:0);
  const totalTax = irUsed + ps;
  const years = Math.max(0, n(S.retAge)-n(S.age));
  const patTotal = n(S.patFin)+n(S.patImmo);
  const L=n(S.livrets), r=n(S.livretRate)/100, rt=n(S.targetRate)/100, inf=n(S.inflation)/100;
  const L10=L*Math.pow(1+r,10), I10=L*Math.pow(1+inf,10), T10=L*Math.pow(1+rt,10);
  const partImmo = patTotal? n(S.patImmo)/patTotal : 0;
  const debtRate = netM? n(S.mensualites)/netM : 0;
  const est = r1/12*S.retRate, w=n(S.retWanted), toCreate=Math.max(0,w-est);
  const capital = toCreate*12/CONFIG.withdrawRate;
  // synthèse : chaque valeur est calculée (auto) mais peut être ajustée par le conseiller (S.ov)
  const ov = S.ov||{}, auto = {}, pick = (k,v) => { auto[k]=v; return ov[k]!=null ? ov[k] : v; };
  const patFinS   = pick('patFinS', n(S.patFin));
  const reserve   = pick('reserve', CONFIG.reserveMonths*netM);
  const investable= pick('investable', Math.max(0, patFinS-reserve));
  const shortfall = Math.max(0, reserve - patFinS);
  const cap = n(S.capMens);
  const precaution= pick('precaution', Math.min(cap, shortfall/12));
  const dispo     = pick('dispo', Math.max(0, cap-precaution));
  const debtRateS = pick('debtRate', debtRate*100)/100;
  const debtMargin= pick('debtMargin', Math.max(0, (CONFIG.debtCap-debtRateS)*netM));
  const borrow    = pick('borrow', pmt2capital(debtMargin, CONFIG.loan.rate, CONFIG.loan.years));
  return {couple, r1, r2, revFoyer, netM, rni, parts, ir, irUsed, tmi:tmi(qfUsed), tauxMoyen: revFoyer? irUsed/revFoyer:0,
    ps, totalTax, years, proj: totalTax*years, patTotal, L, r, rt, inf, L10, I10, T10, gapPts:(rt-r)*100,
    partImmo, debtRate, est, w, toCreate, capital, reserve, investable, shortfall, cap, precaution, dispo, debtMargin, borrow, patFinS, debtRateS, auto};
}

/* profil : scores, bande, correspondance avec la slide à pilules */
function qDone(){ return CARDS.every(c=>{const a=S.answers[c.id]; return c.type==='multi' ? Array.isArray(a)&&a.length>0 : a!=null;}); }
function pScores(){
  const s={tol:0,cap:0,know:0};
  CARDS.forEach(c=>{ const a=S.answers[c.id]; if(a==null) return;
    const add=p=>{for(const k in p) s[k]+=p[k]||0;};
    if(c.type==='multi') a.forEach(i=>add(c.opts[i].pts)); else add((c.opts||c.scen)[a].pts); });
  const pct=k=>MAXP[k]?Math.round(100*s[k]/MAXP[k]):0;
  return {tol:pct('tol'),cap:pct('cap'),know:pct('know')};
}
function pResult(){
  if(!qDone()) return null;
  const sc=pScores(), A=S.answers;
  const comp=.50*sc.tol+.32*sc.cap+.18*sc.know;
  let band = comp<28?0 : comp<52?1 : comp<74?2 : 3;
  if(A.q7===0) band=Math.min(band,0); else if(A.q7===1) band=Math.min(band,1);
  if(A.q6!=null && A.q6<=1) band=Math.min(band,1);
  if(sc.know<25) band=Math.min(band,2);
  if(A.q9===0) band=Math.min(band,0);
  return {band, comp, sc, p:PROFILES[band]};
}
function applyProfileToPills(){
  const res=pResult(); if(!res) return;
  S.know = res.sc.know<34?0 : res.sc.know<67?1 : 2;
  S.risk = res.band===0 ? (res.comp<16?0:1) : res.band+1;
  S.loss = S.answers.q7===0 ? 0 : Math.min(4, Math.floor(res.sc.cap/20.01));
}
function answerLabel(c){
  const a=S.answers[c.id]; if(a==null || (Array.isArray(a)&&!a.length)) return '—';
  if(c.type==='multi') return a.map(i=>c.opts[i].l).join(', ');
  if(c.type==='scenario') return `${c.scen[a].name} (${c.scen[a].lo} % à +${c.scen[a].hi} %)`;
  return c.opts[a].l;
}

/* 13 — fiscalité */
{id:'fiscal', short:'Fiscalité', modes:BOTH, cls:'dark', html:()=>`
  <div class="logo">${LOGO()}</div>
  <div style="padding:58px 64px 0"><h2 class="title">Votre situation fiscale</h2><div class="bar"></div></div>
  <div style="display:grid;grid-template-columns:520px 1fr;gap:40px;padding:34px 64px 0">
    <div class="form">
      <div class="frow"><label>Situation</label><div class="seg" data-seg="sit"><button data-v="seul">Célibataire</button><button data-v="couple">Marié · Pacsé</button></div></div>
      <div class="frow"><label>Enfants à charge</label><div class="step"><button data-step="-1">−</button><b data-o="enfants">0</b><button data-step="1">+</button></div></div>
      <div class="frow" data-show="isoleRow"><label>Parent isolé (case T)</label><div class="seg" data-seg="isole"><button data-v="false">Non</button><button data-v="true">Oui</button></div></div>
      <div class="frow"><label>Âge · départ retraite</label><div class="in">${inp('age','35',70)}<span class="unit">·</span>${inp('retAge','64',70)}<span class="unit">ans</span></div></div>
      <div class="frow"><label>Salaire net annuel</label><div class="in">${inp('rev1','36 000')}<span class="unit">€</span></div></div>
      <div class="frow" data-show="couple"><label>Salaire net conjoint</label><div class="in">${inp('rev2','0')}<span class="unit">€</span></div></div>
      <div class="frow"><label>IR selon l'avis <small style="opacity:.6">(facultatif)</small></label><div class="in">${inp('irAvis','calculé')}<span class="unit">€</span></div></div>
    </div>
    <div class="anim" style="display:flex;flex-direction:column;gap:10px">
      <div class="pill g1" data-p="ir"><span class="lab">Impôt sur le revenu (IR)<small data-o="irSub"></small></span><span class="val">${out('irUsed')}</span></div>
      <div class="pill g2"><span class="lab">Prélèvements sociaux &amp; charges<small>cotisations : coût employeur − salaire net</small></span><span class="val">${out('ps')}</span></div>
      <div class="pill gold" data-p="tot"><span class="lab">Total IR + PS</span><span class="val">${out('totalTax')}<small style="font-size:18px;font-weight:400">/ an</small></span></div>
      <div class="pill g2" data-p="proj"><span class="lab">Projection jusqu'à la retraite<small data-o="projSub"></small></span><span class="val">${out('proj')}</span></div>
      <div class="pill g1"><span class="lab">Capitalisation mobilière actuelle<small>livrets, assurance-vie, PEA, CTO, PER…</small></span><span class="val">${inp('patFin','0')}<span class="unit">€</span></span></div>
      <div class="pill g2"><span class="lab">Capitalisation immobilière (actif net)<small>valeur des biens − capital restant dû</small></span><span class="val">${inp('patImmo','0')}<span class="unit">€</span></span></div>
      <div class="pill gold" data-p="cap"><span class="lab">Total capitalisation</span><span class="val">${out('patTotal')}</span></div>
    </div>
  </div>
  <div class="quote" style="position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#9fb7b2;font-size:21px">« Nous avons construit un État obèse qui dévore ses citoyens à travers des prélèvements étouffants. » — Gaspard Koenig</div>`},

/* 14 — épargne */
{id:'epargne', short:'Épargne', modes:BOTH, cls:'light', html:()=>`
  <div class="logo">${LOGO(false)}</div>
  <div style="padding:58px 80px 0"><div class="kicker" style="color:var(--green3)">Diagnostic</div><h2 class="title" style="margin-top:6px">Votre épargne actuelle</h2></div>
  <div style="display:grid;grid-template-columns:1fr 540px;gap:50px;padding:24px 80px 0">
    <div>
      <div style="font-size:30px;font-weight:700">Les prix montent plus vite que votre livret</div>
      <div style="display:flex;gap:36px;font-size:21px;margin:16px 0 4px;align-items:center">
        <span><i style="display:inline-block;width:34px;height:6px;border-radius:3px;background:var(--gold);vertical-align:middle;margin-right:10px"></i>Coût de la vie · inflation <b>${inp('inflation','3',54)}</b><b>%</b></span>
        <span><i style="display:inline-block;width:34px;height:6px;border-radius:3px;background:var(--green);vertical-align:middle;margin-right:10px"></i>Votre livret · <b data-o="livretRateTxt"></b></span>
      </div>
      <div data-o="chart"></div>
    </div>
    <div style="background:var(--green);color:#fff;border-radius:40px;padding:40px 44px;align-self:start">
      <div style="font-family:var(--serif);font-size:42px;margin-bottom:18px">Votre situation</div>
      ${[['Épargne sur livrets',inp('livrets','10 000',170),'€'],['Rendement actuel',inp('livretRate','1,7',80),'%'],['Rendement visé',inp('targetRate','5',80),'%']]
        .map(([l,i,u])=>`<div class="frow" style="font-size:24px"><label>${l}</label><div class="in" style="font-size:26px">${i}<span class="unit">${u}</span></div></div>`).join('')}
      <div class="frow" style="font-size:24px"><label>Écart à combler</label><div class="in" style="font-size:26px;font-weight:700">${out('gapPts')}</div></div>
      <div style="font-size:22px;color:#d8e4e1;margin:18px 0 8px">Remarques</div>
      <textarea class="note" data-k="epNote" data-t="txt" rows="3" style="background:rgba(255,255,255,.08);color:#fff;border-radius:22px;font-size:20px;padding:16px 20px" placeholder="Épargne de précaution à conserver, projets à venir…"></textarea>
    </div>
  </div>
  <div class="quote" style="position:absolute;left:80px;bottom:56px;color:var(--green3)">« L'inflation, c'est l'impôt sans la loi. » — Milton Friedman</div>
  <div style="position:absolute;left:80px;bottom:22px;font-size:16px;font-style:italic;color:var(--green3)">Livret A : taux en vigueur depuis le 01/08/2026. Inflation : hypothèse modifiable. Projection à taux constants sur 10 ans, non garantie.</div>`},

/* 15 — immobilier */
{id:'immo', short:'Immobilier', modes:BOTH, cls:'light', html:()=>`
  <div class="split" style="grid-template-columns:640px 1fr">
    <div class="l">
      <div class="big" style="margin-top:50px">47%</div>
      <div class="bigsub">des Français envisagent<br>d'investir dans l'immobilier<br>dans les prochaines années</div>
      <div class="bar" style="width:100%;margin:44px 0"></div>
      <div class="quote" style="text-align:center;color:var(--ivory)">« L'effet de levier bancaire est le moyen le plus puissant pour accélérer la constitution de patrimoine. »</div>
      <div class="foot" style="font-size:17px">${CONFIG.firm} · CGP Indépendant · ${CONFIG.email}</div>
    </div>
    <div class="r">
      <div class="logo">${LOGO(false)}</div>
      <h2 class="title">L'investissement immobilier</h2><div class="bar" style="width:290px"></div>
      <div class="anim" style="display:flex;flex-direction:column;gap:12px;margin-top:34px">
        <div class="pill b1"><span class="lab">Votre patrimoine global actuel (actif net)</span><span class="val">${out('patTotal')}</span></div>
        <div class="pill b2"><span class="lab">Votre patrimoine immobilier actuel (actif net)</span><span class="val">${inp('patImmo','0')}<span class="unit">€</span></span></div>
        <div class="pill b1"><span class="lab">% de l'immobilier / global (actif net)</span><span class="val">${out('partImmo')}</span></div>
        <div class="pill b2"><span class="lab">Mensualités de crédit en cours</span><span class="val">${inp('mensualites','0',140)}<span class="unit">€/mois</span></span></div>
        <div class="pill b1" data-p="debt"><span class="lab">Votre taux d'endettement actuel<small data-o="debtSub"></small></span><span class="val">${out('debtRate')}</span></div>
      </div>
      <textarea class="note" data-k="immoNote" data-t="txt" rows="4" style="margin-top:26px" placeholder="Des remarques et des commentaires sur vos projets d'investissement immobilier ?"></textarea>
    </div>
  </div>`},

/* 16 — retraite */
{id:'retraite', short:'Retraite', modes:BOTH, cls:'light', html:()=>`
  <div class="split" style="grid-template-columns:640px 1fr">
    <div class="l">
      <div class="big" style="margin-top:50px">67%</div>
      <div class="bigsub">des salariés craignent<br>de ne pas toucher<br>de retraite du tout</div>
      <div class="bar" style="width:100%;margin:44px 0"></div>
      <div class="quote" style="text-align:center;color:var(--ivory)">« Le système de retraite par répartition est condamné à terme, car il repose sur un équilibre démographique qui n'existe plus. »</div>
      <div class="foot" style="font-size:17px">${CONFIG.firm} · CGP Indépendant · ${CONFIG.email}</div>
    </div>
    <div class="r">
      <div class="logo">${LOGO(false)}</div>
      <h2 class="title">Votre retraite</h2><div class="bar"></div>
      <div class="anim" style="display:flex;flex-direction:column;gap:14px;margin-top:34px">

/* ------------------------------------------------------------ CONSTRUCTION */
const stage = document.getElementById('stage');
stage.innerHTML = SLIDES.map((s,i)=>`<section class="slide ${s.cls}" data-i="${i}" data-id="${s.id}">${s.html()}</section>`).join('');
const idx = id => SLIDES.findIndex(s=>s.id===id);
document.getElementById('dots').innerHTML = SLIDES.map((s,i)=>
  (i>0 && SLIDES[i-1].part==='pres' && s.part!=='pres' ? '<span class="sep"></span>' : '') +
  `<button data-go="${i}" title="${s.short}">${i+1}. ${s.short}</button>`).join('');

// champs liés à l'état (un même champ peut apparaître sur plusieurs slides)
function bindFields(root){
  root.querySelectorAll('[data-k]').forEach(el=>{
    const k=el.dataset.k, t=el.dataset.t||'num';
    const show = () => { const v=getK(k); el.value = t==='num' ? fmtIn(v) : (v==null?'':v); };
    show();
    el.addEventListener('input',()=>{
      setK(k, t==='num' ? parseNum(el.value) : t==='range' ? +el.value : el.value);
      stage.querySelectorAll(`[data-k="${k}"]`).forEach(o=>{ if(o!==el){ const v=getK(k); o.value = t==='num'?fmtIn(v):(v==null?'':v); } });
      refresh();
    });
    if(t==='num') el.addEventListener('blur',()=>{ el.value=fmtIn(getK(k)); });
    el.addEventListener('keydown',e=>{ if(e.key==='Enter' && el.tagName==='INPUT') el.blur(); });
  });
}
bindFields(stage);
stage.querySelectorAll('[data-seg]').forEach(g=>{
  const k=g.dataset.seg;
  g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const v=b.dataset.v; S[k] = v==='true'?true : v==='false'?false : isNaN(+v)?v:+v; refresh(); });
});
stage.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ S.enfants=Math.max(0,Math.min(10,n(S.enfants)+(+b.dataset.step))); refresh(); });
stage.querySelectorAll('[data-chips]').forEach(g=>{
  const k=g.dataset.chips;
  g.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ S[k] = S[k]===+b.dataset.v ? null : +b.dataset.v; refresh(); });
});
stage.querySelectorAll('[data-ov]').forEach(el=>{
  el.addEventListener('input',()=>{ S.ov[el.dataset.ov]=parseNum(el.value); refresh(); });
  el.addEventListener('blur',()=>refresh());
  el.addEventListener('keydown',e=>{ if(e.key==='Enter') el.blur(); });
});
stage.querySelectorAll('[data-ovreset]').forEach(b=>b.onclick=()=>{ delete S.ov[b.dataset.ovreset]; refresh(); });
{ const oa=document.getElementById('ovAll'); if(oa) oa.onclick=()=>{ S.ov={}; refresh(); }; }
stage.querySelectorAll('[data-simp] .chip').forEach(b=>b.onclick=()=>{ S.simProfile=+b.dataset.v; refresh(); });
stage.querySelectorAll('[data-rate]').forEach(g=>{
  const k=g.dataset.rate;
  g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.prio[k] = S.prio[k]===+b.dataset.v ? 0 : +b.dataset.v; refresh(); });
});
stage.querySelectorAll('[data-goid]').forEach(b=>b.onclick=()=>show(idx(b.dataset.goid)));
const DOC_ST = ['À initier','En cours','Signé ✓'];
stage.querySelectorAll('[data-doc]').forEach(d=>d.onclick=()=>{ const i=+d.dataset.doc; S.docs[i]=(S.docs[i]+1)%3; refresh(); });

/* ------------------------------------------------------------ QUESTIONNAIRE */
let printing=false;
const qz = () => document.getElementById('qzone');
function renderQNav(){
  const box=document.getElementById('qnav'); if(!box) return;
  const cur = S.qIdx<CARDS.length ? CARDS[S.qIdx].sec : null;
  box.innerHTML = Object.entries(SECTIONS).map(([k,l])=>`<div class="qsec ${k===cur?'on':''}">${l}</div>
    <div class="qdots">${CARDS.map((c,i)=>c.sec!==k?'':`<button data-q="${i}" title="Question ${i+1}" class="${answered(c)?'f':''} ${i===S.qIdx?'cur':''}"></button>`).join('')}</div>`).join('');
  box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ S.qIdx=+b.dataset.q; renderQuiz(); });
}
const answered = c => { const a=S.answers[c.id]; return c.type==='multi' ? Array.isArray(a)&&a.length>0 : a!=null; };
function recapHTML(){
  return `<div class="recapq">${CARDS.map(c=>`<div><span>${String(CARDS.indexOf(c)+1).padStart(2,'0')} · ${c.s}</span><b>${esc(answerLabel(c))}</b></div>`).join('')}</div>`;
}
function renderQuiz(){
  const z=qz(); if(!z) return;
  renderQNav();
  if(printing || S.qIdx>=CARDS.length){
    const done=qDone(), res=pResult();
    z.innerHTML = `<div class="anim"><div class="qmeta"><span class="s">Récapitulatif</span><span>${CARDS.filter(answered).length} / ${CARDS.length} réponses</span></div>
      <h3 style="font-size:40px;margin:16px 0 0">${done?'Questionnaire complété ✓':'Questionnaire à compléter'}</h3>
      ${res?`<div style="font-size:24px;color:var(--green3);margin-top:8px">Profil déterminé : <b style="color:var(--green)">${res.p.key}</b></div>`:''}
      ${recapHTML()}
      <div class="noprint" style="display:flex;gap:16px;margin-top:26px">
        ${done?`<button class="btn dk" id="qSee">Découvrir le profil →</button>`:`<button class="btn dk" id="qResume">Reprendre le questionnaire</button>`}
        <button class="btn lk" id="qRedo">Recommencer</button></div></div>`;
    const go=z.querySelector('#qSee'); if(go) go.onclick=()=>show(idx('resultat'));
    const rs=z.querySelector('#qResume'); if(rs) rs.onclick=()=>{ S.qIdx=Math.max(0,CARDS.findIndex(c=>!answered(c))); renderQuiz(); };
    const rd=z.querySelector('#qRedo'); if(rd) rd.onclick=()=>{ if(confirm('Effacer les réponses au questionnaire ?')){ S.answers={}; S.qIdx=0; refresh(); renderQuiz(); } };
    return;
  }
  const c=CARDS[S.qIdx], tot=CARDS.length;
  z.innerHTML = `<div class="qmeta"><span class="s">${SECTIONS[c.sec]}</span><span>Question ${S.qIdx+1} / ${tot}</span></div>
    <div class="qbar"><i style="width:${Math.round(100*S.qIdx/tot)}%"></i></div>
    <div class="qhead"><div class="qnum">${String(S.qIdx+1).padStart(2,'0')}</div><div><h3 class="qtitle">${c.q}</h3><p class="qhelp">${c.help}</p></div></div>
    <div id="opts"></div>
    <div style="position:absolute;left:70px;right:70px;bottom:40px;display:flex;justify-content:space-between;align-items:center">
      <button class="btn lk" id="qPrev">← ${S.qIdx===0?'Retour':'Précédente'}</button>
      <span style="font-size:15px;color:var(--green3)">Touches 1–${(c.opts||c.scen).length} pour répondre</span>
      ${c.type==='multi'?`<button class="btn dk" id="qNext">Continuer →</button>`:`<button class="btn lk" id="qNext">${answered(c)?'Suivante →':'Passer →'}</button>`}
    </div>`;
  const box=z.querySelector('#opts');
  const next=()=>{ S.qIdx++; if(S.qIdx>=tot && qDone()) applyProfileToPills(); refresh(); renderQuiz(); };
  if(c.type==='scenario'){
    const lo=Math.min(...c.scen.map(s=>s.lo)), hi=Math.max(...c.scen.map(s=>s.hi));
    box.className='opts anim'; box.style.gridTemplateColumns='repeat(3,1fr)';
    box.innerHTML=c.scen.map((s,i)=>`<button class="scen ${S.answers[c.id]===i?'sel':''}" data-i="${i}"><h4>${s.name}</h4>${scenSVG(s.lo,s.hi,lo,hi,S.answers[c.id]===i)}<div class="pick">${S.answers[c.id]===i?'✓ Sélectionné':'Choisir'}</div></button>`).join('');
  }else{
    box.className='opts anim'; box.style.gridTemplateColumns = c.opts.length>4 ? 'repeat(3,1fr)' : '1fr 1fr';
    const sel=S.answers[c.id];
    box.innerHTML=c.opts.map((o,i)=>{ const on = c.type==='multi' ? (sel||[]).includes(i) : sel===i;
      return `<button class="opt ${on?'sel':''}" data-i="${i}"><span class="k">${'ABCDEF'[i]}</span><span><b>${o.l}</b><small>${o.d}</small></span></button>`; }).join('');
  }
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(c.type==='multi'){
      const arr=(S.answers[c.id]||[]).slice(), k=arr.indexOf(i); k>=0?arr.splice(k,1):arr.push(i); S.answers[c.id]=arr;
      b.classList.toggle('sel'); z.querySelector('#qNext').disabled=!arr.length; refresh(); renderQNav();
    }else{
      S.answers[c.id]=i;
      box.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('sel',x===b));
      refresh(); setTimeout(next,280);
    }
  });
  const qn=z.querySelector('#qNext');
  if(c.type==='multi') qn.disabled=!(S.answers[c.id]||[]).length;
  qn.onclick=next;

function scenSVG(lo,hi,gLo,gHi,sel){

const DON=['#f3ead6','#c9a97b','#7fa9a1'];
function gaugeSVG(band){
  const W=600,H=320,cx=300,cy=290,r=230,segs=PROFILES.length; let paths='';
  for(let i=0;i<segs;i++){
    const a0=Math.PI*(1-i/segs)-.02, a1=Math.PI*(1-(i+1)/segs)+.02;
    const x0=cx+Math.cos(a0)*r, y0=cy-Math.sin(a0)*r, x1=cx+Math.cos(a1)*r, y1=cy-Math.sin(a1)*r;
    paths+=`<path d="M ${x0} ${y0} A ${r} ${r} 0 0 1 ${x1} ${y1}" fill="none" stroke="${PROFILES[i].color}" stroke-width="${i===band?40:22}" stroke-linecap="round" opacity="${i===band?1:.4}"/>`;
    const am=Math.PI*(1-(i+.5)/segs);
    paths+=`<text x="${cx+Math.cos(am)*(r-64)}" y="${cy-Math.sin(am)*(r-64)+6}" text-anchor="middle" font-size="17" fill="${i===band?'#f3ead6':'#87a39d'}" font-family="Calibri,Carlito,Arial" ${i===band?'font-weight="bold"':''}>${PROFILES[i].key}</text>`;
  }
  const ang=Math.PI*(1-(band+.5)/segs), nx=cx+Math.cos(ang)*(r-100), ny=cy-Math.sin(ang)*(r-100);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${paths}
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#c9a97b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="14" fill="#c9a97b"/><circle cx="${cx}" cy="${cy}" r="5" fill="#234d47"/></svg>`;
}
function donutSVG(alloc){
  const S0=210,c=105,r=80,sw=36,C=2*Math.PI*r; let off=0,segs='';
  alloc.forEach((a,i)=>{ const len=a[1]/100*C;
    segs+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${DON[i]}" stroke-width="${sw}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${c} ${c})"/>`; off+=len; });
  return `<svg width="${S0}" height="${S0}" viewBox="0 0 ${S0} ${S0}" style="flex:0 0 ${S0}px">${segs}
    <text x="${c}" y="${c-4}" text-anchor="middle" font-size="40" font-weight="bold" fill="#f3ead6" font-family="Calibri,Carlito,Arial">${alloc[0][1]}%</text>
    <text x="${c}" y="${c+22}" text-anchor="middle" font-size="15" fill="#9fb7b2" font-family="Calibri,Carlito,Arial">${alloc[0][0].split(' ')[0].toLowerCase()}</text></svg>`;
}
function proj1SVG(A,p){
  // barres flottantes depuis le capital investi : gain vers le haut, perte vers le bas
  const W=1440,H=250,pt=36,pb=30;
  const e=p.exp/100, v=p.vol/100;
  const vals=[A*(1+e-2*v),A*(1+e-v),A*(1+e),A*(1+e+v),A*(1+e+2*v)];
  const labels=['très défavorable','défavorable','attendu','favorable','très favorable'];
  const cols=['#b14a3b','#cf8a4f','#426f69','#4f9a6a','#2f7d4f'];
  const up=Math.max(1,...vals.map(x=>x-A)), dn=Math.max(1,...vals.map(x=>A-x)), k=(H-pt-pb)/(up+dn);
  const y0=pt+up*k, y=x=>y0-(x-A)*k, bw=W/5;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Calibri,Carlito,Arial">
    <line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="#c9a97b" stroke-width="2" stroke-dasharray="8 8"/>
    ${vals.map((x,i)=>{ const bx=i*bw+bw*.3, w=bw*.4, yy=y(x), top=Math.min(yy,y0), h=Math.max(4,Math.abs(yy-y0)), d=x-A;
      return `<rect x="${bx}" y="${top}" width="${w}" height="${h}" rx="12" fill="${cols[i]}"/>
      <text x="${bx+w/2}" y="${d>=0?top-10:top+h+24}" text-anchor="middle" font-size="22" font-weight="bold" fill="#234d47">${eurK(x)}</text>
      <text x="${bx+w/2}" y="${d>=0?y0+24:y0-10}" text-anchor="middle" font-size="17" fill="#426f69">${labels[i]} · ${d>=0?'+':'−'}${fmt(Math.abs(d/A*100),0)} %</text>`; }).join('')}
  </svg>`;
}

/* graphique épargne */
function chart(c){
  const W=880,H=470,pl=20,pr=230,pt=30,pb=70,Y=10;
  if(!c.L) return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><text x="${W/2-100}" y="${H/2}" text-anchor="middle" font-size="24" fill="#426f69" font-style="italic">Saisissez le montant de vos livrets →</text></svg>`;
  const f=(rate,t)=>c.L*Math.pow(1+rate,t);
  const inf=Array.from({length:Y+1},(_,t)=>f(c.inf,t)), liv=Array.from({length:Y+1},(_,t)=>f(c.r,t)), tgt=Array.from({length:Y+1},(_,t)=>f(c.rt,t));
  const lo=c.L*0.97, hi=Math.max(...inf,...liv,...tgt)*1.03;
  const x=t=>pl+t*(W-pl-pr)/Y, y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  const line=a=>a.map((v,t)=>`${t?'L':'M'}${x(t).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${line(inf)} ${liv.slice().reverse().map((v,i)=>`L${x(Y-i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')} Z`;
  const gap=c.I10-c.L10, X=x(Y), yI=y(c.I10), yL=y(c.L10), yT=y(c.T10);
  const mid=(yI+yL)/2, yTop=Math.min(yI+8, mid-56), yBot=Math.max(yL+8, mid+84);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Calibri,Carlito,Arial,sans-serif">
    ${[0,.33,.66,1].map(f=>`<line x1="${pl}" x2="${X}" y1="${pt+f*(H-pt-pb)}" y2="${pt+f*(H-pt-pb)}" stroke="#234d47" stroke-opacity=".1"/>`).join('')}
    <line x1="${pl}" x2="${X}" y1="${H-pb+12}" y2="${H-pb+12}" stroke="#234d47" stroke-opacity=".5"/>
    ${gap>0?`<path d="${area}" fill="#c9a97b" fill-opacity=".25"/>`:''}
    <path d="${line(tgt)}" fill="none" stroke="#426f69" stroke-width="2.5" stroke-dasharray="7 7" opacity=".75"/>
    <path d="${line(inf)}" fill="none" stroke="#c9a97b" stroke-width="6" stroke-linecap="round"/>
    <path d="${line(liv)}" fill="none" stroke="#234d47" stroke-width="6" stroke-linecap="round"/>
    <circle cx="${x(0)}" cy="${y(c.L)}" r="9" fill="#234d47"/><circle cx="${X}" cy="${yI}" r="9" fill="#c9a97b"/><circle cx="${X}" cy="${yL}" r="9" fill="#234d47"/>
    <text x="${x(0)}" y="${H-pb+42}" font-size="22" fill="#426f69">Aujourd'hui</text>
    <text x="${x(5)}" y="${H-pb+42}" font-size="22" fill="#426f69" text-anchor="middle">5 ans</text>
    <text x="${X}" y="${H-pb+42}" font-size="22" fill="#426f69" text-anchor="middle">10 ans</text>
    <text x="${x(0)}" y="${H-4}" font-size="25" font-weight="700" fill="#234d47">${eur(c.L)}</text>
    ${gap>0?`<line x1="${X+24}" x2="${X+24}" y1="${yI}" y2="${yL}" stroke="#c9a97b" stroke-width="3"/>`:''}
    <text x="${X+40}" y="${yTop}" font-size="25" font-weight="700" fill="#234d47">${eur(c.I10)}</text>
    ${gap>0?`<text x="${X+40}" y="${mid+12}" font-size="40" font-weight="700" fill="#234d47">−${eur(gap)}</text>
      <text x="${X+40}" y="${mid+42}" font-size="22" fill="#426f69">qui manquent</text>`
      :`<text x="${X+40}" y="${mid+8}" font-size="26" font-weight="700" fill="#2f7d4f">Inflation couverte</text>`}
    <text x="${X+40}" y="${yBot}" font-size="25" font-weight="700" fill="#234d47">${eur(c.L10)}</text>
    ${c.T10>c.I10?`<text x="${X-8}" y="${yT-14}" font-size="19" fill="#426f69" text-anchor="end" font-style="italic">à ${fmt(c.rt*100,1)} % : ${eur(c.T10)}</text>`:''}
  </svg>`;
}

/* ------------------------------------------------------------ NAVIGATION */
let cur = Math.min(+(sessionStorage.getItem(SKEY+'-slide')||0), SLIDES.length-1);
function show(i){
  cur=Math.max(0,Math.min(SLIDES.length-1,i));
  stage.querySelectorAll('.slide').forEach((s,j)=>{ s.classList.toggle('on',j===cur); s.classList.toggle('prev',j<cur); });
  document.querySelectorAll('#dots button').forEach((b,j)=>b.classList.toggle('on',j===cur));
  const on=document.querySelector('#dots button.on'); on&&on.scrollIntoView({block:'nearest',inline:'center'});
  sessionStorage.setItem(SKEY+'-slide',cur);
}
function fit(){
  const vp=document.getElementById('viewport');
  stage.style.transform=`scale(${Math.min(vp.clientWidth/1600, vp.clientHeight/900)*0.98})`;
}
document.getElementById('dots').onclick=e=>{ const b=e.target.closest('[data-go]'); if(b) show(+b.dataset.go); };
document.getElementById('bPrev').onclick=()=>show(cur-1);
document.getElementById('bNext').onclick=()=>show(cur+1);
document.getElementById('bFull').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')) return;
  if(SLIDES[cur].id==='quiz' && S.qIdx<CARDS.length && /^[1-6]$/.test(e.key)){
    const b=document.querySelectorAll('#opts [data-i]')[+e.key-1]; if(b){ b.click(); return; }
  }
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); show(cur+1); }
  if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); show(cur-1); }
  if(e.key==='f'||e.key==='F') document.getElementById('bFull').click();
  if(e.key==='Escape') document.getElementById('pdfMenu').classList.add('hidden');
  if(e.key==='h'||e.key==='H') toggleBar();
});
stage.addEventListener('focusin',e=>{ const s=e.target.closest('.slide'); if(s && +s.dataset.i!==cur) show(+s.dataset.i); });
window.addEventListener('resize',fit);

const oc=document.getElementById('openCal');
if(oc){
  oc.onclick=()=>{ const f=document.getElementById('calFrame'), ifr=f.querySelector('iframe');
    if(!ifr.src) ifr.src=CONFIG.calUrl+'?embed=true&theme=light'; f.classList.remove('hidden'); };
  document.getElementById('closeCal').onclick=()=>document.getElementById('calFrame').classList.add('hidden');
}

/* PDF */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3200);}
function pdf(scope='all'){
  document.getElementById('pdfMenu').classList.add('hidden');
  document.activeElement && document.activeElement.blur();
  stage.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('skipprint', scope==='bilan' && SLIDES[i].part==='pres'));
  const old=document.title;
  document.title=`${scope==='all'&&MODE==='full'?'Présentation':'Bilan patrimonial'} MIC${S.client?' — '+S.client:''}`;
  toast('Destination : « Enregistrer au format PDF », marges : aucune.');
  setTimeout(()=>{ window.print(); document.title=old; },350);
}
window.addEventListener('beforeprint',()=>{ printing=true; renderQuiz(); });
window.addEventListener('afterprint',()=>{ printing=false; renderQuiz(); stage.querySelectorAll('.skipprint').forEach(s=>s.classList.remove('skipprint')); });
document.getElementById('bPdf').onclick=()=>{ if(MODE==='full') document.getElementById('pdfMenu').classList.toggle('hidden'); else pdf('all'); };
document.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>pdf(b.dataset.pdf));
document.getElementById('pdf2').onclick=()=>pdf(MODE==='full'?'bilan':'all');
document.getElementById('bReset').onclick=()=>{
  if(!confirm('Effacer toutes les saisies et démarrer un nouveau client ?')) return;
  sessionStorage.removeItem(SKEY); sessionStorage.removeItem(SKEY+'-slide'); location.reload();
};

function toggleBar(force){
  const hide = force!=null ? force : !document.body.classList.contains('nobar');
  document.body.classList.toggle('nobar', hide);
  document.getElementById('pdfMenu').classList.add('hidden');
  sessionStorage.setItem(SKEY+'-nobar', hide?'1':'');
  fit(); setTimeout(fit,380);
  if(hide && force==null) toast('Barre masquée — touche H ou « menu » en bas pour la réafficher');
}
document.getElementById('bHide').onclick=()=>toggleBar();
document.getElementById('barTab').onclick=()=>toggleBar(false);
if(sessionStorage.getItem(SKEY+'-nobar')) toggleBar(true);

refresh(); renderQuiz(); fit(); show(cur);
</script>
</body>
