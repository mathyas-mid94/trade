<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Serif;src:url(../fonts/CormorantGaramond.ttf);font-weight:300 700}
@font-face{font-family:Sans;src:url(../fonts/Inter.ttf);font-weight:100 900}
html,body{margin:0;background:#FBF7EC;overflow:hidden}
svg{display:block}
</style></head>
<body>
<!-- Intro générique MIC : "on passe un instrument financier à la loupe", la loupe devient le logo.
     Calée sur le son brand/mic-sound-reference.m4a (impact à 7,4 s du fichier = 5,34 s ici). -->
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#FBF7EC"/>
  <defs><clipPath id="lensClip"><circle id="lensHole" cx="0" cy="0" r="100"/></clipPath></defs>
  <g id="world"></g>
  <g id="logo"></g>
</svg>
<script src="../lib/dalio.js"></script>
<script>
const CONFIG = { tagline: "" };
// Variantes par catégorie : intro.html?theme=defiscalisation (la loupe s'arrête toujours sur l'icône du milieu)
const THEMES = {
  generique: { label: "", kinds: ["house", "pie", "coins", "contract", "curve"], labels: ["IMMOBILIER", "ALLOCATION", "ÉPARGNE", "CONTRATS", "MARCHÉS"] },
  defiscalisation: { label: "DÉFISCALISATION", kinds: ["house", "coins", "percent", "contract", "curve"],
    labels: ["IMMOBILIER", "RETRAITE", "IMPÔTS", "CONTRATS", "PLACEMENTS"],
    // sous la loupe : le "%" rétrécit et sa flèche pousse vers le bas (on fait baisser l'impôt)
    react(f, k) { f.querySelector("text").setAttribute("transform", `translate(-8 -2) scale(${1 - 0.35 * k}) translate(8 2)`);
      [...f.querySelectorAll("path")].pop().setAttribute("transform", `translate(0 ${8 * k})`); } },
  assurancevie: { label: "ASSURANCE-VIE", kinds: ["house", "coins", "contract", "piggy", "curve"],
    labels: ["IMMOBILIER", "ÉPARGNE", "ASSURANCE-VIE", "RETRAITE", "PLACEMENTS"],
    // sous la loupe : le sceau du contrat grossit, comme un tampon
    react(f, k) { f.querySelector("circle").setAttribute("transform", `translate(28 42) scale(${1 + 0.8 * k}) translate(-28 -42)`); } },
  enfants: { label: "ENFANTS", kinds: ["house", "coins", "sprout", "contract", "curve"],
    labels: ["IMMOBILIER", "ÉPARGNE", "ENFANTS", "ASSURANCE-VIE", "PLACEMENTS"],
    // sous la loupe : la pousse sort des pièces et grandit (le capital de l'enfant)
    react(f, k) { f.firstElementChild.lastElementChild.setAttribute("transform", `translate(32 -16) scale(${1 + 0.7 * k}) translate(-32 16)`); } },
  retraite: { label: "RETRAITE", kinds: ["house", "coins", "sablier", "contract", "curve"],
    labels: ["IMMOBILIER", "ÉPARGNE", "RETRAITE", "CONTRATS", "PLACEMENTS"],
    // sous la loupe : le sablier se retourne (le temps passe, on prépare la suite)
    react(f, k) { f.firstElementChild.setAttribute("transform", `rotate(${180 * k})`); } },
  credit: { label: "CRÉDIT", kinds: ["house", "coins", "bouclier", "contract", "curve"],
    labels: ["IMMOBILIER", "ÉPARGNE", "CRÉDIT", "ASSURANCE", "PLACEMENTS"],
    // sous la loupe : la coche « protégé » grossit sur le bouclier (le prêt est couvert)
    react(f, k) { f.firstElementChild.lastElementChild.setAttribute("transform", `translate(34 34) scale(${1 + 0.8 * k}) translate(-34 -34)`); } },
  structures: { label: "PRODUITS STRUCTURÉS", kinds: ["house", "coins", "structure", "contract", "bourse"],
    labels: ["IMMOBILIER", "ÉPARGNE", "STRUCTURÉS", "CONTRATS", "BOURSE"],
    // sous la loupe : le couvercle « option » se soulève au-dessus du socle « obligation »
    react(f, k) { f.firstElementChild.lastElementChild.setAttribute("transform", `translate(0 ${-22 * k}) rotate(${-8 * k})`); } },
  bourse: { label: "BOURSE", kinds: ["house", "coins", "bourse", "contract", "pie"],
    labels: ["IMMOBILIER", "ÉPARGNE", "BOURSE", "CONTRATS", "ALLOCATION"],
    // sous la loupe : la flèche de tendance monte (le capital grandit)
    react(f, k) { f.firstElementChild.lastElementChild.setAttribute("transform", `translate(${6 * k} ${-14 * k})`); } },
  immobilier: { label: "IMMOBILIER", kinds: ["house", "coins", "immeuble", "contract", "curve"],
    labels: ["LOGEMENT", "ÉPARGNE", "IMMOBILIER", "CONTRATS", "PLACEMENTS"],
    // sous la loupe : les fenêtres du parc s'allument une à une (les loyers tombent)
    react(f, k) { [...f.firstElementChild.lastElementChild.children].forEach((r, i) => r.setAttribute("fill", k * 18 > i ? C.accent : C.paper)); } },
  obligations: { label: "OBLIGATIONS", kinds: ["house", "coins", "obligation", "bourse", "pie"],
    labels: ["IMMOBILIER", "ÉPARGNE", "OBLIGATIONS", "ACTIONS", "ALLOCATION"],
    // sous la loupe : les coupons se détachent un à un du titre (les intérêts tombent)
    react(f, k) { [...f.firstElementChild.lastElementChild.children].forEach((c, i) => { const u = Math.max(0, Math.min(1, k * 1.6 - i * 0.3));
      c.setAttribute("transform", `translate(${16 * u} ${10 * u}) rotate(${12 * u} 43 0)`); }); } },
  bases: { label: "LES BASES", kinds: ["coins", "receipt", "piggy", "pie", "sprout"],
    labels: ["REVENUS", "DÉPENSES", "LES BASES", "BUDGET", "INVESTIR"],
    // sous la loupe : la pièce tombe dans la fente de la tirelire (se payer en premier)
    react(f, k) { const c = f.firstElementChild.lastElementChild; c.setAttribute("transform", `translate(0 ${30 * Math.min(1, k)})`); c.style.opacity = k > 0.95 ? 0 : 1; } },
  budget: { label: "BUDGET", kinds: ["coins", "receipt", "pie", "piggy", "house"],
    labels: ["REVENUS", "DÉPENSES", "BUDGET", "ÉPARGNE", "LOGEMENT"],
    // sous la loupe : le camembert tourne et une part se détache (on découpe le budget)
    react(f, k, t) { const parts = f.querySelectorAll("path"), a = 2.51;
      f.firstElementChild.setAttribute("transform", `rotate(${120 * k})`);
      parts[1].setAttribute("transform", `translate(${22 * k * Math.cos(a)} ${22 * k * Math.sin(a)})`); } },
};
const THEME = THEMES[new URLSearchParams(location.search).get("theme")] || THEMES.generique;
const { C, el, prog, ease, easeOut, back, lerp } = D;
const svg = document.getElementById("s");
const world = document.getElementById("world"), logo = document.getElementById("logo");
const easeIn = x => x * x * x;

// ---------- Scène : le personnage, les instruments, la loupe ----------
const GX = 330, GY = 930, GS = 1.08;
const guy = D.guy(world);

const ROW_Y = 520, KINDS = THEME.kinds;
const ROW_X = [760, 1000, 1240, 1480, 1720];
const LABELS = THEME.labels;
// une rangée = 5 icônes + étiquettes ; construite deux fois (normale + vue grossie dans la loupe)
function makeRow(parent) {
  return KINDS.map((k, i) => {
    const g = el("g", {}, parent); D.icons[k](g);
    const label = el("text", { x: ROW_X[i], y: ROW_Y + 115, "text-anchor": "middle", "font-family": "Sans", "font-weight": 600,
      "font-size": 20, "letter-spacing": 4, fill: C.inkSoft }, parent);
    label.textContent = LABELS[i];
    return { g, label, x: ROW_X[i], y: ROW_Y, a: 0.35 + i * 0.17 };
  });
}
const rowA = makeRow(el("g", {}, world));
const lensView = el("g", { "clip-path": "url(#lensClip)" }, world);
el("rect", { x: -3000, y: -3000, width: 9000, height: 9000, fill: C.paper }, lensView);
const zoomed = el("g", {}, lensView);
const rowB = makeRow(zoomed);
const hole = document.getElementById("lensHole");

const mag = D.magnifier(world, 115);
const TARGET = 2;   // l'icône sur laquelle la loupe s'arrête (celle du thème)
const focus = rowB[TARGET].g;   // sous la loupe, l'icône cible réagit (THEME.react)
const sparks = [];
for (let i = 0; i < 8; i++) {
  const a = -Math.PI * 0.95 + i * 0.25, r0 = 140, r1 = 175 + (i % 2) * 18;
  const p = el("path", { ...D.line, "stroke-width": 4, d: `M${r0 * Math.cos(a)} ${r0 * Math.sin(a)} L${r1 * Math.cos(a)} ${r1 * Math.sin(a)}` }, mag.g);
  D.drawOn(p, 2.95 + (i % 3) * 0.03, 3.1 + (i % 3) * 0.03); sparks.push(p);
}

function lensPos(t) {
  // apparition à gauche de la rangée, balayage jusqu'au bout, retour sur la cible
  const x0 = 640, x1 = ROW_X[4], xt = ROW_X[TARGET];
  let x = x0;
  if (t > 1.1) x = lerp(x0, x1, ease(prog(t, 1.1, 2.2)));
  if (t > 2.2) x = lerp(x1, xt, ease(prog(t, 2.2, 2.9)));
  const y = ROW_Y + Math.sin(prog(t, 1.1, 2.9) * Math.PI * 3) * 14;   // petite ondulation de la main
  return [x, y];
}

// ---------- Logo MIC ----------
const LX = 960, LY = 500, LR = 250;
let M = null;
window.ready = Promise.all([document.fonts.load("500 100px Serif"), document.fonts.load("600 20px Sans")]).then(() => {
  M = D.micLogo(logo, LX, LY, LR);
  M.outer.setAttribute("transform", "");
  D.drawOn(M.inner, 4.45, 5.0);
  D.drawOn(M.ruleL, 5.55, 5.9); D.drawOn(M.ruleR, 5.55, 5.9);
  M.impact = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i - 4.5) * 0.17 + (i < 5 ? -0.9 : 0.9);
    const r0 = LR + 22, r1 = LR + 48 + (i % 2) * 14;
    const p = el("path", { ...D.line, "stroke-width": 3, d: `M${LX + r0 * Math.cos(a)} ${LY + r0 * Math.sin(a)} L${LX + r1 * Math.cos(a)} ${LY + r1 * Math.sin(a)}` }, logo);
    D.drawOn(p, 5.3 + (i % 3) * 0.03, 5.45 + (i % 3) * 0.03);
  }
  M.tag = el("text", { x: LX, y: LY + LR + 110, "text-anchor": "middle", "font-size": 34, "font-family": "Sans", "font-weight": 500,
    fill: C.inkSoft, "letter-spacing": 9 }, logo);
  M.tag.textContent = CONFIG.tagline.toUpperCase();
  if (THEME.label) { M.cat = el("text", { x: LX, y: LY + LR + 80, "text-anchor": "middle", "font-family": "Sans", "font-weight": 700,
    "font-size": 30, "letter-spacing": 10, fill: C.inkSoft }, logo); M.cat.textContent = THEME.label; }
  D.paper(svg);
});

// ---------- rendu ----------
const ZOOM_END = 3.85, Z_MAX = 1300 / 115;
window.DURATION = 7.9;
window.render = function (t) {
  D.updateDraws(t);

  // personnage
  const sg = back(prog(t, 0.05, 0.5));
  guy.g.style.opacity = sg > 0 ? 1 : 0;
  guy.pose(100, 70).place(GX, GY, GS * sg);

  // icônes qui apparaissent une à une, avec leur étiquette
  for (const it of [...rowA, ...rowB]) {
    const s = back(prog(t, it.a, it.a + 0.4));
    it.g.setAttribute("transform", `translate(${it.x} ${it.y}) scale(${s})`);
    it.g.style.opacity = s > 0 ? 1 : 0;
    const lk = ease(prog(t, it.a + 0.2, it.a + 0.5));
    it.label.style.opacity = lk;
    it.label.setAttribute("transform", `translate(0 ${12 * (1 - lk)})`);
  }

  // loupe + vue grossie (x1,7 autour du centre du verre)
  const [lx, ly] = lensPos(t);
  const ms = back(prog(t, 0.85, 1.25));
  mag.g.style.opacity = ms > 0 ? 1 : 0;
  const pulse = 1 + 0.06 * Math.sin(prog(t, 2.9, 3.2) * Math.PI);
  mag.g.setAttribute("transform", `translate(${lx} ${ly}) scale(${ms * pulse})`);
  hole.setAttribute("cx", lx); hole.setAttribute("cy", ly); hole.setAttribute("r", (mag.r - 5) * ms * pulse);
  const MZ = 1.7;
  zoomed.setAttribute("transform", `translate(${lx} ${ly}) scale(${MZ}) translate(${-lx} ${-ly})`);
  lensView.style.opacity = ms > 0 ? 1 : 0;
  zoomed.style.opacity = 1 - prog(t, 3.4, 3.8);
  mag.glint.style.opacity = 1 - prog(t, 3.55, 3.8);   // l'intérieur du verre se vide avant de devenir le logo

  // le bras élastique va chercher le manche
  const hx = lx + mag.handleEnd[0] * ms * pulse, hy = ly + mag.handleEnd[1] * ms * pulse;
  if (ms > 0.05) guy.reach(1, (hx - GX) / (GS * sg || 1), (hy - GY) / (GS * sg || 1), 45);

  // caméra : légère poussée, puis plongée dans la loupe
  const zk = easeIn(prog(t, 3.15, ZOOM_END));
  const z = lerp(lerp(1, 1.05, ease(prog(t, 0, 3.1))), Z_MAX, zk);
  const wc = [lerp(960, lx, Math.min(1, zk * 4)), lerp(540, ly, Math.min(1, zk * 4))];
  const sc = [960, lerp(540, LY, zk)];
  world.setAttribute("transform", `translate(${sc[0]} ${sc[1]}) scale(${z}) translate(${-wc[0]} ${-wc[1]})`);
  world.style.opacity = t < ZOOM_END ? 1 : 0;

  // le verre devient le cercle du logo
  logo.style.opacity = t >= ZOOM_END ? 1 : 0;
  const ir = easeOut(prog(t, ZOOM_END, 4.5));
  const R = lerp(1300, LR, ir);
  M.disc.setAttribute("r", R); M.outer.setAttribute("r", R);
  M.outer.setAttribute("stroke-width", lerp(9 * Z_MAX, 3.2 * LR / 175, ir));
  M.outer.removeAttribute("stroke-dasharray");
  M.letters.forEach((L, i) => { const k = prog(t, 4.85 + i * 0.12, 5.1 + i * 0.12);
    L.t.style.opacity = k > 0 ? 1 : 0;
    L.t.setAttribute("transform", `translate(${L.x} ${L.y}) scale(${lerp(1.8, 1, easeOut(k))}) translate(${-L.x} ${-L.y})`); });
  const sk = prog(t, 5.3, 5.65), amp = sk > 0 && sk < 1 ? (1 - sk) * 8 : 0;
  logo.setAttribute("transform", `translate(${Math.sin(t * 90) * amp} ${Math.cos(t * 71) * amp})`);
  const tk = ease(prog(t, 6.1, 6.6));
  M.tag.style.opacity = tk; M.tag.setAttribute("transform", `translate(0 ${18 * (1 - tk)})`);
  if (M.cat) { const k = easeOut(prog(t, 5.7, 6.2)); M.cat.style.opacity = k; M.cat.setAttribute("transform", `translate(0 ${16 * (1 - k)})`); }
  if (THEME.react) THEME.react(focus, back(prog(t, 2.85, 3.25)), t);
};
window.ready.then(() => render(0));
</script>
</body></html>
