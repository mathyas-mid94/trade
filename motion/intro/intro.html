<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Hand;src:url(../fonts/PatrickHand.ttf)}
html,body{margin:0;background:#FAF8F3;overflow:hidden}
svg{display:block}
text{font-family:Hand}
</style></head>
<body>
<!-- Intro style "How the Economic Machine Works" : trait noir dessiné à la main, fond crème, accents de couleur rares -->
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="rough"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <clipPath id="nameClip"><rect id="nameRect" x="0" y="640" width="0" height="200"/></clipPath>
  </defs>
  <g id="scene" filter="url(#rough)" fill="none" stroke="#1d1d1d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></g>
  <g id="logo" filter="url(#rough)" fill="none" stroke="#1d1d1d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></g>
</svg>
<script>
const CONFIG = {
  name: "TON NOM ICI",          // nom de la chaîne
  tagline: "comprendre les marchés, simplement",
  accentUp: "#2E9E5B", accentDown: "#D94A3D", accentBlue: "#3A7BD5",
  logoSrc: null                 // ex: "logo.svg" -> remplace le logo dessiné
};
const NS = "http://www.w3.org/2000/svg";
const scene = document.getElementById("scene"), logo = document.getElementById("logo");
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

const clamp = x => Math.max(0, Math.min(1, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
const back = x => { const c = 1.9; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };

// chemins "tracés" : chacun a une fenêtre [a,b] pendant laquelle il se dessine
const draws = [];
function draw(d, a, b, parent, extra = {}) {
  const p = el("path", { d, ...extra }, parent);
  draws.push({ p, a, b, len: p.getTotalLength() + 2 });
  return p;
}

// --- sol + petit graphique ---
draw("M120 860 C 600 852, 1300 866, 1800 858", 0.0, 0.7, scene);
const chart = el("g", {}, scene);
draw("M200 820 L200 470 M200 820 L640 820", 0.2, 0.8, chart);
draw("M220 780 L290 720 L340 750 L420 640 L470 670 L560 520 L620 540", 0.6, 1.7, chart, { stroke: CONFIG.accentUp, "stroke-width": 8 });
draw("M590 515 L622 538 L596 568", 1.6, 1.85, chart, { stroke: CONFIG.accentUp, "stroke-width": 8 });

// --- engrenages (la "machine") ---
function gearPath(cx, cy, r, teeth) {
  let d = "", n = teeth * 4;
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI * 2, rr = (i % 4 < 2) ? r + 22 : r;
    const x = cx + rr * Math.cos(a), y = cy + rr * Math.sin(a);
    d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }
  return d + `M${cx + r*0.35} ${cy} A${r*0.35} ${r*0.35} 0 1 0 ${cx - r*0.35} ${cy} A${r*0.35} ${r*0.35} 0 1 0 ${cx + r*0.35} ${cy}`;
}
const g1 = el("g", {}, scene), g2 = el("g", {}, scene);
draw(gearPath(0, 0, 120, 12), 1.0, 2.0, g1);
draw(gearPath(0, 0, 70, 7), 1.3, 2.1, g2, { stroke: CONFIG.accentBlue });

// --- bonhomme ---
const guy = el("g", {}, scene);
draw("M1545 605 A45 45 0 1 1 1455 605 A45 45 0 1 1 1545 605", 1.6, 2.1, guy);           // tête
draw("M1500 650 L1500 770", 1.9, 2.2, guy);                      // corps
draw("M1500 770 L1460 855 M1500 770 L1540 855", 2.0, 2.4, guy);  // jambes
draw("M1500 680 L1450 740", 2.1, 2.4, guy);                      // bras gauche
const arm = draw("M0 0 L60 -50", 2.2, 2.5, el("g", { id: "armg" }, guy)); // bras qui salue
const eyes = el("g", { fill: "#1d1d1d", stroke: "none" }, guy);
el("circle", { cx: 1485, cy: 600, r: 5 }, eyes); el("circle", { cx: 1515, cy: 600, r: 5 }, eyes);
const smile = draw("M1484 625 Q1500 640 1516 625", 2.2, 2.45, guy);

// --- logo (placeholder dessiné : cercle + chandeliers) ---
const LX = 960, LY = 420;
const logoG = el("g", {}, logo);
draw(`M${LX+150} ${LY} A150 150 0 1 1 ${LX-150} ${LY} A150 150 0 1 1 ${LX+150} ${LY}`, 3.7, 4.5, logoG);
const candles = [
  { x: -70, o: 40, c: -10, h: -40, l: 60, up: true },
  { x: 0,   o: 10, c: 50,  h: -10, l: 75, up: false },
  { x: 70,  o: 30, c: -70, h: -95, l: 45, up: true },
];
const candleFills = [];
candles.forEach((k, i) => {
  const a = 4.2 + i * 0.18;
  draw(`M${LX+k.x} ${LY+k.h} L${LX+k.x} ${LY+k.l}`, a, a + 0.25, logoG, { "stroke-width": 6 });
  const top = Math.min(k.o, k.c), hgt = Math.abs(k.o - k.c);
  const r = el("rect", { x: LX+k.x-20, y: LY+top, width: 40, height: hgt, rx: 4,
    fill: k.up ? CONFIG.accentUp : CONFIG.accentDown, "stroke-width": 6 }, logoG);
  candleFills.push({ r, a: a + 0.15, cx: LX + k.x, cy: LY + top + hgt/2 });
});
let logoImg = null;
if (CONFIG.logoSrc) { logoG.style.display = "none";
  logoImg = el("image", { href: CONFIG.logoSrc, x: LX-170, y: LY-170, width: 340, height: 340 }, document.getElementById("s")); }

// --- nom + soulignement + slogan ---
const nameT = el("text", { x: LX, y: 760, "text-anchor": "middle", "font-size": 130, fill: "#1d1d1d",
  stroke: "none", "clip-path": "url(#nameClip)" }, document.getElementById("s"));
nameT.textContent = CONFIG.name;
const w = nameT.getComputedTextLength();
draw(`M${LX - w/2} 800 C ${LX - w/4} 788, ${LX + w/4} 812, ${LX + w/2} 794`, 5.5, 6.0, logo, { stroke: CONFIG.accentBlue, "stroke-width": 9 });
const tag = el("text", { x: LX, y: 880, "text-anchor": "middle", "font-size": 52, fill: "#555", stroke: "none" }, document.getElementById("s"));
tag.textContent = CONFIG.tagline;

// --- rendu d'une frame à l'instant t (secondes) ---
window.DURATION = 7.5;
window.render = function (t) {
  // trait qui "vibre" légèrement, comme un dessin à la main (change toutes les 3 frames)
  document.getElementById("turb").setAttribute("seed", 1 + Math.floor(t * 10) % 4);
  for (const d of draws) {
    const k = ease(prog(t, d.a, d.b));
    d.p.setAttribute("stroke-dasharray", d.len);
    d.p.setAttribute("stroke-dashoffset", d.len * (1 - k));
    d.p.style.opacity = k > 0 ? 1 : 0;
  }
  // engrenages : tournent une fois dessinés, en sens inverse
  const rot = Math.max(0, t - 1.6) * 60;
  g1.setAttribute("transform", `translate(980 600) rotate(${rot})`);
  g2.setAttribute("transform", `translate(1172 470) rotate(${-rot * 120/70 + 12})`);
  // bras qui salue
  const wave = t > 2.5 ? Math.sin((t - 2.5) * 12) * 18 * (1 - prog(t, 2.5, 3.4)) : 0;
  document.getElementById("armg").setAttribute("transform", `translate(1500 680) rotate(${wave})`);
  eyes.style.opacity = t > 2.1 ? 1 : 0;
  // caméra : zoom avant dans la machine, la scène s'efface
  const z = ease(prog(t, 3.2, 4.0));
  scene.setAttribute("transform", `translate(1076 560) scale(${1 + z * 2.2}) translate(-1076 -560)`);
  scene.style.opacity = 1 - z;
  // bougies du logo : remplissage avec petit rebond
  for (const c of candleFills) {
    const k = prog(t, c.a, c.a + 0.35), s = k > 0 ? back(k) : 0;
    c.r.setAttribute("transform", `translate(${c.cx} ${c.cy}) scale(${s}) translate(${-c.cx} ${-c.cy})`);
  }
  if (logoImg) { const k = prog(t, 3.8, 4.5); logoImg.style.opacity = k;
    logoImg.setAttribute("transform", `translate(${LX} ${LY}) scale(${0.6 + 0.4*back(k)}) translate(${-LX} ${-LY})`); }
  // nom : révélé de gauche à droite comme écrit au feutre
  const nk = ease(prog(t, 4.7, 5.6));
  const nr = document.getElementById("nameRect");
  nr.setAttribute("x", LX - w/2 - 10); nr.setAttribute("width", (w + 20) * nk);
  tag.style.opacity = ease(prog(t, 6.0, 6.6));
  tag.setAttribute("transform", `translate(0 ${20 * (1 - ease(prog(t, 6.0, 6.6)))})`);
};
render(0);
</script>
</body></html>
