<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Serif;src:url(../../fonts/CormorantGaramond.ttf);font-weight:300 700}
@font-face{font-family:Sans;src:url(../../fonts/Inter.ttf);font-weight:100 900}
html,body{margin:0;background:#FBF7EC;overflow:hidden}
svg{display:block}
</style></head>
<body>
<!-- « Le Girardin industriel » — payer moins d'impôts en aidant l'Outre-mer.
     Les scènes sont écrites sur le minutage ESTIMÉ du script (estimation.js, tools/estime.py) : chaque scène reçoit
     A.s (début), A.m(k) (instant du repère [k]) et A.e (fin). Quand la voix ElevenLabs arrive, align.py produit
     timing.js et le moteur déforme le temps de chaque scène pour que chaque image tombe sur son mot. -->
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#FBF7EC"/>
  <g id="scenes"></g>
</svg>
<script src="../../lib/dalio.js"></script>
<script src="../../lib/kit.js"></script>
<script>
const { C, el, prog, ease, easeOut, back, lerp } = D;
const { pop, fade, out, place, show, txt, pill, card, coin, stack, envelope, padlock, vault, heart, shield, bank, icon, calendar, bars, chart, fmt, chapter } = K;
const svg = document.getElementById("s"), root = document.getElementById("scenes");
const OV = 0.6;
const SCENES = [];
// SC(numéro, titre du chapitre, build(g, A) -> render(t)) ; les scènes sont dans l'ordre des parties de SCRIPT.md
const SC = (num, title, build) => SCENES.push({ num, title, build });
let DRAWS = null;
const draw = (p, a, b) => { DRAWS.push({ p, a, b, len: p.getTotalLength() + 2 }); return p; };
function updateDraws(list, t) {
  for (const d of list) { const k = ease(prog(t, d.a, d.b));
    d.p.setAttribute("stroke-dasharray", d.len); d.p.setAttribute("stroke-dashoffset", d.len * (1 - k)); d.p.style.opacity = k > 0 ? 1 : 0; }
}
</script>
<script src="../../lib/objets.js"></script>
<script src="objets-girardin.js"></script>
<script src="estimation.js"></script>
<script>window.EST = window.TIMING; window.TIMING = null;</script>
<script src="timing.js" onerror="window.TIMING = null"></script>
<script src="scenes-1.js"></script>
<script src="scenes-2.js"></script>
<script src="scenes-3.js"></script>
<script>
// ---------- moteur ----------
const RUN = [], EST = window.EST, TIM = window.TIMING || null;
window.ready = Promise.all([document.fonts.load("500 100px Serif"), document.fonts.load("700 100px Serif"), document.fonts.load("600 20px Sans"), document.fonts.load("800 20px Sans")]).then(() => {
  SCENES.forEach((sc, i) => {
    const P = EST.parts[i], next = EST.parts[i + 1];
    const A = { s: P.start, e: next ? next.start : EST.total, m: k => P.markers[k - 1] };
    const g = el("g", {}, root);
    chapter(g, sc.num, sc.title);
    DRAWS = [];
    const render = sc.build(g, A);
    // temps de la voix -> temps estimé de la scène (identité sans timing.js)
    let ns = A.s - 0.35, ne = A.e - 0.35, pts = [[ns, ns]];
    if (TIM) {
      const part = TIM.parts[i], tn = TIM.parts[i + 1];
      ns = i === 0 ? 0 : part.start - 0.35; ne = tn ? tn.start - 0.35 : TIM.total;
      pts = [[ns, A.s - 0.35]];
      P.markers.forEach((o, k) => { const n = part.markers[k];
        if (n != null && o > pts[pts.length - 1][1] && n > pts[pts.length - 1][0] + 0.05 && n < ne) pts.push([n, o]); });
      pts.push([ne, Math.max(A.e - 0.35, pts[pts.length - 1][1] + 0.5)]);
    }
    if (i === 0) ns = 0;
    const warp = t => { if (t <= pts[0][0]) return pts[0][1] + (t - pts[0][0]);
      for (let k = 1; k < pts.length; k++) if (t <= pts[k][0]) { const [n0, o0] = pts[k - 1], [n1, o1] = pts[k]; return o0 + (o1 - o0) * (t - n0) / (n1 - n0); }
      const [n1, o1] = pts[pts.length - 1]; return o1 + (t - n1); };
    RUN.push({ g, ns, ne, warp, render, draws: DRAWS });
  });
  window.DURATION = (TIM || EST).total + 2.5;
  D.paper(svg);
});
window.DURATION = EST.total + 2.5;
window.render = function (t) {
  RUN.forEach((r, i) => {
    if (t < r.ns || t > r.ne + OV) { r.g.style.display = "none"; return; }
    r.g.style.display = "";
    const inK = i === 0 ? 1 : ease(prog(t, r.ns, r.ns + OV)), outK = i === RUN.length - 1 ? 0 : ease(prog(t, r.ne, r.ne + OV));
    r.g.setAttribute("transform", `translate(${(1 - inK) * 260 - outK * 260} 0)`);
    r.g.style.opacity = Math.min(inK, 1 - outK);
    const to = r.warp(t);
    updateDraws(r.draws, to);
    r.render(to);
  });
};
window.ready.then(() => render(0));
</script>
</body></html>
